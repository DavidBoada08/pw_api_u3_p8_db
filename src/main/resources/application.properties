# Puerto HTTP
quarkus.http.port=8081

# Conexión a PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=admin
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/api

# Configuración JPA
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# Documentación OpenAPI
quarkus.smallrye-openapi.path=/openapi

# Nombre de la Api
quarkus.http.root-path=/API/matricula/v1/

# Configuración CORS para permitir conexión entre backend y frontend
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=*
quarkus.http.cors.headers=*

# Configuración de packaging (reemplaza la configuración deprecada)
quarkus.package.jar.enabled=true
quarkus.package.jar.type=uber-jar